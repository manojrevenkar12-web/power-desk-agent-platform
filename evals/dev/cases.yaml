# Development cases. The agent and the simulated model may be tuned against these.
- id: avg-de-july
  user: lena
  question: What was the average German day-ahead price in July?
  expect:
    tools: [price_stats]
    numbers:
      - { metric: average_price, zone: DE-LU, start: "2026-07-01", end: "2026-08-01" }
- id: peak-fr-august
  user: marc
  question: What was the average French peak price in August?
  expect:
    tools: [price_stats]
    numbers:
      - { metric: average_price, zone: FR, start: "2026-08-01", end: "2026-09-01", product: peak }
- id: extremes-nl-june
  user: sofia
  question: What were the highest and lowest Dutch day-ahead prices in June?
  expect:
    tools: [price_stats]
    numbers:
      - { metric: max_price, zone: NL, start: "2026-06-01", end: "2026-07-01" }
      - { metric: min_price, zone: NL, start: "2026-06-01", end: "2026-07-01" }
- id: why-low-12-july
  user: lena
  question: Why were German prices so low on 12 July?
  expect:
    tools: [price_drivers]
    numbers:
      - { metric: min_price, zone: DE-LU, start: "2026-07-12", end: "2026-07-13" }
- id: why-high-de-september
  user: sofia
  question: Explain what drove German prices in September, including the highest quarter hour.
  expect:
    tools: [price_drivers, price_stats]
    numbers:
      - { metric: max_price, zone: DE-LU, start: "2026-09-01", end: "2026-10-01" }
- id: negative-de-september
  user: tom
  question: How many negative hours did Germany have in September?
  expect:
    tools: [negative_prices]
    numbers:
      - { metric: negative_hours, zone: DE-LU, start: "2026-09-01", end: "2026-10-01" }
- id: negative-nl-summer
  user: lena
  question: Review negative prices in the Netherlands over the summer, June to September.
  expect:
    tools: [negative_prices, capture_price]
    numbers:
      - { metric: negative_hours, zone: NL, start: "2026-06-01", end: "2026-10-01" }
      - { metric: capture_price, zone: NL, start: "2026-06-01", end: "2026-10-01", technology: solar }
- id: capture-solar-de-august
  user: ines
  question: What was the German solar capture rate in August?
  expect:
    tools: [capture_price]
    numbers:
      - { metric: capture_rate, zone: DE-LU, start: "2026-08-01", end: "2026-09-01", technology: solar }
- id: capture-wind-fr-q3
  user: marc
  question: What capture price did French wind get in Q3?
  expect:
    tools: [capture_price]
    numbers:
      - { metric: capture_price, zone: FR, start: "2026-07-01", end: "2026-10-01", technology: wind }
- id: ppa-sol-04-july
  user: lena
  question: How did PPA-DE-SOL-04 do in July?
  expect:
    tools: [ppa_valuation]
    numbers:
      - { metric: ppa_capture_price, ppa: PPA-DE-SOL-04, start: "2026-07-01", end: "2026-08-01" }
      - { metric: ppa_pnl, ppa: PPA-DE-SOL-04, start: "2026-07-01", end: "2026-08-01" }
- id: ppa-off-03-august
  user: ravi
  question: What was the P&L of PPA-DE-OFF-03 in August?
  expect:
    tools: [ppa_valuation]
    numbers:
      - { metric: ppa_pnl, ppa: PPA-DE-OFF-03, start: "2026-08-01", end: "2026-09-01" }
- id: ppa-win-05-summer
  user: ines
  question: Give me the volume and capture price of PPA-FR-WIN-05 from June to September.
  expect:
    tools: [ppa_valuation]
    numbers:
      - { metric: ppa_volume, ppa: PPA-FR-WIN-05, start: "2026-06-01", end: "2026-10-01" }
      - { metric: ppa_capture_price, ppa: PPA-FR-WIN-05, start: "2026-06-01", end: "2026-10-01" }
- id: portfolio-paris-summer
  user: ines
  question: How did our PPAs perform over the summer, June to September?
  expect:
    tools: [ppa_portfolio, ppa_valuation]
    numbers:
      - { metric: portfolio_pnl, books: [origination-fr], start: "2026-06-01", end: "2026-10-01" }
    must_not_reveal: [book:origination-de, book:trading-fr]
