name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: powerdesk
          POSTGRES_PASSWORD: powerdesk
          POSTGRES_DB: powerdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U powerdesk" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POWERDESK_TEST_DATABASE_URL: postgresql://powerdesk:powerdesk@127.0.0.1:5432/powerdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[dev,infra]"
      - run: ruff check src infra tests && ruff format --check src infra tests
      - run: mypy
      - name: All tests (pgvector, CDK synth with cdk-nag)
        run: pytest -q
      - name: Evals and release gate
        run: powerdesk evals all && powerdesk gate
      - name: Reports are reproducible
        run: git diff --exit-code reports/evals
      - name: Generated schemas and rollout files are current
        run: powerdesk export-schemas && powerdesk rollout && git diff --exit-code infra/schemas rollout/out

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: console/package-lock.json }
      - run: pip install -e ..
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          PYTHON: python

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both arm64 images (not pushed)
        run: |
          docker buildx build --platform linux/arm64 --target lambda -t power-desk:ci-lambda .
          docker buildx build --platform linux/arm64 --target runtime -t power-desk:ci-runtime .
