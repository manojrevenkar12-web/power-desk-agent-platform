# Held-out set for the desk research agent. Written blind from WRITING_CASES.md only.

# ---------- Answerable: price statistics ----------

- id: de-base-july
  user: lena
  question: "What did DE base average day-ahead in July?"
  expect:
    outcome: answer
    numbers:
      - { metric: average_price, zone: DE-LU, start: "2026-07-01", end: "2026-08-01" }
  note: "Plain monthly baseload average."

- id: fr-peak-august
  user: marc
  question: "FR peak average for August, day-ahead please"
  expect:
    outcome: answer
    numbers:
      - { metric: average_price, zone: FR, start: "2026-08-01", end: "2026-09-01", product: peak }
  note: "Peak definition (weekdays 08-20) has to be applied."

- id: nl-june-range
  user: sofia
  question: "Lowest and highest NL day-ahead price in June?"
  expect:
    outcome: answer
    numbers:
      - { metric: min_price, zone: NL, start: "2026-06-01", end: "2026-07-01" }
      - { metric: max_price, zone: NL, start: "2026-06-01", end: "2026-07-01" }

- id: de-intraday-vs-da-september
  user: tom
  question: "How did intraday compare with day-ahead in Germany in September, on average?"
  expect:
    outcome: answer
    numbers:
      - { metric: average_price, zone: DE-LU, start: "2026-09-01", end: "2026-10-01", kind: day_ahead }
      - { metric: average_price, zone: DE-LU, start: "2026-09-01", end: "2026-10-01", kind: intraday }

- id: de-offpeak-summer
  user: ravi
  question: "Offpeak DE average June through September?"
  expect:
    outcome: answer
    numbers:
      - { metric: average_price, zone: DE-LU, start: "2026-06-01", end: "2026-10-01", product: offpeak }

# ---------- Answerable: why prices moved ----------

- id: why-de-low-mid-august
  user: sofia
  question: "Why was German day-ahead so soft the week of 10 August?"
  expect:
    outcome: answer
    numbers:
      - { metric: average_price, zone: DE-LU, start: "2026-08-10", end: "2026-08-17" }
  note: "Explanation should rest on fundamentals (wind, solar, demand, gas, carbon), with the week's average."

- id: why-fr-july-up
  user: marc
  question: "France went up from June to July, what drove that?"
  expect:
    outcome: answer
    numbers:
      - { metric: average_price, zone: FR, start: "2026-06-01", end: "2026-07-01" }
      - { metric: average_price, zone: FR, start: "2026-07-01", end: "2026-08-01" }
  note: "Phrased as if prices rose; the numbers decide whether that is true."

